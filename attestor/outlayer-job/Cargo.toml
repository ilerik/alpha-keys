[package]
name = "outlayer-job"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "outlayer-job"
path = "src/main.rs"

[dependencies]
feed-core = { path = "../feed-core" }
pnl-core = { path = "../pnl-core" }
serde_json = "1"

# HTTPS exists only in the wasm32-wasip2 worker. Native tests keep the fake Fetch.
[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
wasi-http-client = "0.2"
